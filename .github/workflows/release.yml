name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      url: ${{ steps.package.outputs.url }}
      sha256: ${{ steps.package.outputs.sha256 }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Swift 6.2
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ -z "${TAG}" ]]; then
            echo "Tag is required."
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v[0-9A-Za-z.+_-]+$ ]]; then
            echo "Invalid tag format: ${TAG}"
            exit 1
          fi

          VERSION="${TAG#v}"
          OS="darwin"
          ASSET_NAME="rinter_${VERSION}_${OS}.tar.gz"
          # SemVer pre-release uses a hyphen suffix (e.g. 1.0.0-alpha.1).
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "asset=${ASSET_NAME}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve Swift version hash
        id: swift-version
        shell: bash
        run: |
          echo "value=$(swift --version | shasum -a 256 | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"

      - name: Cache SwiftPM artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/arm64
            .build/x86_64
            ~/.swiftpm
          key: ${{ runner.os }}-spm-universal-${{ steps.swift-version.outputs.value }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-universal-${{ steps.swift-version.outputs.value }}-
            ${{ runner.os }}-spm-universal-

      - name: Embed release version from tag
        shell: bash
        run: |
          set -euo pipefail
          cat > Sources/RinterCLI/RinterCLIVersion.swift <<EOF
          enum RinterCLIVersion {
              static let value = "${{ steps.meta.outputs.version }}"
          }
          EOF

      - name: Build universal release binary
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --triple arm64-apple-macosx --build-path .build/arm64
          swift build -c release --triple x86_64-apple-macosx --build-path .build/x86_64
          mkdir -p dist
          lipo -create -output dist/rinter .build/arm64/release/rinter .build/x86_64/release/rinter
          lipo -info dist/rinter | grep -q 'Architectures in the fat file:.*arm64'
          lipo -info dist/rinter | grep -q 'Architectures in the fat file:.*x86_64'
          for ARCH in arm64 x86_64; do
            MINOS="$(otool -arch "${ARCH}" -l dist/rinter | awk '/LC_BUILD_VERSION/{f=1} f && /^[[:space:]]*minos /{print $2; exit}')"
            if [[ "${MINOS}" != "13.0" ]]; then
              echo "Expected minos 13.0 for ${ARCH}, got ${MINOS}"
              exit 1
            fi
          done

      - name: Package release asset
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -czf "${{ steps.meta.outputs.asset }}" rinter
          SHA256="$(shasum -a 256 "${{ steps.meta.outputs.asset }}" | cut -d' ' -f1)"
          echo "${SHA256}  ${{ steps.meta.outputs.asset }}" > checksums.txt
          {
            echo "sha256=${SHA256}"
            echo "url=https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/${{ steps.meta.outputs.asset }}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-macos
          path: |
            ${{ steps.meta.outputs.asset }}
            checksums.txt

      - name: Create or update release with assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            CURRENT_PRERELEASE="$(gh release view "${TAG}" --json isPrerelease -q .isPrerelease)"
            DESIRED_PRERELEASE="${{ steps.meta.outputs.prerelease }}"
            if [[ "${CURRENT_PRERELEASE}" != "${DESIRED_PRERELEASE}" ]]; then
              if [[ "${DESIRED_PRERELEASE}" == "true" ]]; then
                gh release edit "${TAG}" --prerelease
              else
                gh release edit "${TAG}" --prerelease=false
              fi
            fi
            LEGACY_ASSET="rinter_${{ steps.meta.outputs.version }}_darwin_arm64.tar.gz"
            LEGACY_ID="$(gh release view "${TAG}" --json assets -q ".assets[] | select(.name == \"${LEGACY_ASSET}\") | .id" || true)"
            if [[ -n "${LEGACY_ID}" ]]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${LEGACY_ID}"
            fi
            gh release upload "${TAG}" \
              "${{ steps.meta.outputs.asset }}" \
              checksums.txt \
              --clobber
          else
            if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              PRERELEASE_FLAG="--prerelease"
            else
              PRERELEASE_FLAG=""
            fi

            gh release create "${TAG}" \
              "${{ steps.meta.outputs.asset }}" \
              checksums.txt \
              --target "${{ github.sha }}" \
              --generate-notes \
              --title "${TITLE}" \
              ${PRERELEASE_FLAG}
          fi

  dispatch-formula:
    needs: release-macos
    if: needs.release-macos.outputs.prerelease != 'true'
    uses: novr/homebrew-taps/.github/workflows/dispatch-formula.yml@3c774dfd3408b2bf7ecd66ea045d9f85ac3e6ac4
    with:
      formula: rinter
      version: ${{ needs.release-macos.outputs.version }}
      sha256: ${{ needs.release-macos.outputs.sha256 }}
    secrets:
      NOVRD_BOT_CLIENT_ID: ${{ secrets.NOVRD_BOT_CLIENT_ID }}
      NOVRD_BOT_KEY: ${{ secrets.NOVRD_BOT_KEY }}
