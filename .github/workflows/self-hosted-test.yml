name: Self-hosted runner test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, macos, tart, xcode]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show runner environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          echo "Runner name: ${RUNNER_NAME:-unknown}"

      - name: Test
        run: swift test
