name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Swift 6.2
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Build universal release binary
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --triple arm64-apple-macosx --build-path .build/arm64
          swift build -c release --triple x86_64-apple-macosx --build-path .build/x86_64
          mkdir -p dist
          lipo -create -output dist/rinter .build/arm64/release/rinter .build/x86_64/release/rinter
          lipo -info dist/rinter | grep -q 'Architectures in the fat file:.*arm64'
          lipo -info dist/rinter | grep -q 'Architectures in the fat file:.*x86_64'

      - name: Test
        run: swift test
