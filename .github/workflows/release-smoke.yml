name: Release Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show trigger context
        run: |
          echo "workflow=release-smoke"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"

      - name: Build smoke target
        run: swift build -c release
